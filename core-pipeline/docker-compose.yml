# core-pipeline — deployed on its own.
#
#   docker compose --env-file .env up -d --build
#
# Shares only data with review-ui: the database (DATABASE_URL) and Azure Blob.
# Chart working folders are scratch in ./outputs (deleted after 7 unused days);
# review-ui does not mount them. Guide: docs/specials/VM_GUIDE.md.
#
# Database: new  -> psql "$DATABASE_URL" -f ../schema/schema.sql
#           existing -> psql "$DATABASE_URL" -f ../schema/migrate.sql

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: advantmed/core-pipeline:latest
    ports:
      - "${API_PORT:-8001}:8001"
    env_file:
      - ./.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:5432/imaging_outputs}
      DB_POOL_MIN: ${DB_POOL_MIN:-1}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}

      # Scratch: chart working folders (purged after OUTPUTS_RETENTION_DAYS) and manifests.
      # review-ui does not mount these; it reads the database and Azure Blob.
      DATA_ROOT: /data/outputs/charts
      METADATA_ROOT: /data/outputs/metadata

      # Pages per chart × charts in a batch must fit the pool (see BATCH_*).
      STAGE_WORKERS: ${STAGE_WORKERS:-4}
      BATCH_WORKERS: ${BATCH_WORKERS:-4}
      BATCH_POOL_HEADROOM: ${BATCH_POOL_HEADROOM:-2}
      AZURE_DI_MAX_CONCURRENT: ${AZURE_DI_MAX_CONCURRENT:-4}
      AZURE_RETRY_ATTEMPTS: ${AZURE_RETRY_ATTEMPTS:-5}

      # Docling / ONNX abort diagnostics (see .env.example). Must be in the
      # process environment at startup — faulthandler dumps to stderr on SIGABRT.
      PYTHONFAULTHANDLER: ${PYTHONFAULTHANDLER:-1}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}

      # --- Azure Blob: chart intake + manifest sweep ---
      # Auth: key | entra | entra_interactive | managed_identity
      AZURE_STORAGE_AUTH: ${AZURE_STORAGE_AUTH:-entra}
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME:-}
      AZURE_STORAGE_ACCOUNT_KEY: ${AZURE_STORAGE_ACCOUNT_KEY:-}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-imaging-pipeline}
      # User-assigned MI (system-assigned: leave blank)
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_PRINCIPAL_ID: ${AZURE_PRINCIPAL_ID:-}
      AZURE_BLOB_CONNECTION_POOL_SIZE: ${AZURE_BLOB_CONNECTION_POOL_SIZE:-50}

      # --- Azure Document Intelligence: final2 OCR (billed per page) ---
      AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT: ${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT:-}
      AZURE_DOCUMENT_INTELLIGENCE_KEY: ${AZURE_DOCUMENT_INTELLIGENCE_KEY:-}
      AZURE_POLL_TIMEOUT_SECONDS: ${AZURE_POLL_TIMEOUT_SECONDS:-180}
      AZURE_DI_FEATURES: ${AZURE_DI_FEATURES:-languages,barcodes}
      AZURE_DI_CONNECTION_POOL_SIZE: ${AZURE_DI_CONNECTION_POOL_SIZE:-32}

      # Page sequencing (optional ONNX cross-encoder; default = markers/headers).
      SEQUENCING_CROSS_ENCODER: ${SEQUENCING_CROSS_ENCODER:-false}

      # --- Member verification NER layer ---
      # OFF unless the GLiNER checkpoints are under models/ner. While off, no
      # page can be marked wrong_member, so no document can be Rejected.
      # NER toggles and every model path come from env_file (.env). Do NOT
      # re-declare MEMBER_NER_* or BLANK_JUNK_MODEL_DIR / HW_MODEL_PATH here
      # with ${VAR:-…} — Compose interpolates from the host shell first, so a
      # leftover export would override the file. Paths in .env are relative
      # to core-pipeline/ and land on the models mount below.
      SKIP_OCR: ${SKIP_OCR:-false}

      TESSERACT_CMD: /usr/bin/tesseract
      # Daily file logs (also still on stdout for `docker compose logs`).
      LOG_DIR: /app/core-pipeline/logs
      LOG_TO_FILE: ${LOG_TO_FILE:-true}
      LOG_BACKUP_DAYS: ${LOG_BACKUP_DAYS:-30}
      # Colour worker tags in stdout (docker compose logs preserves ANSI).
      LOG_COLOR: ${LOG_COLOR:-true}
    volumes:
      # core-pipeline/outputs/ on the host: scratch, not shared with review-ui.
      - ${OUTPUTS_HOST_PATH:-./outputs}:/data/outputs
      # core-pipeline/models/ on the host: large checkpoints plus the small
      # models (blank-junk/, kv-extraction/, hw/). page-family/page-leaf/,
      # page-family/page-axes/ and encounter/ come with git (encoders via
      # `git lfs pull`); the other weights are copied by hand.
      # .env paths such as models/page-family/page-axes resolve here. Writable: GLiNER
      # repairs encoder config.json on first load.
      - ${MODELS_HOST_PATH:-./models}:/app/core-pipeline/models
      - ${LOGS_HOST_PATH:-./logs}:/app/core-pipeline/logs
    extra_hosts:
      # Lets DATABASE_URL point at a Postgres on the docker host.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
