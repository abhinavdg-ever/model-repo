<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page label review</title>
  <style>
    :root {
      --brand-800: #2c4620;
      --brand-700: #3a5c28;
      --paper: #f7f6f2;
      --line: #d9d6cc;
      --ink: #1c2e15;
      --muted: #5c6556;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 14px/1.4 "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.7rem 1rem;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    header h1 { margin: 0; font-size: 1rem; }
    header input[type="search"] {
      flex: 1;
      max-width: 22rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.35rem 0.55rem;
    }
    header label { color: var(--muted); font-size: 0.85rem; }
    main {
      display: grid;
      grid-template-columns: 16rem minmax(0, 1fr) 22rem;
      height: calc(100% - 3.2rem);
    }
    #list {
      overflow: auto;
      border-right: 1px solid var(--line);
      background: #fff;
    }
    #list button {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: #fff;
      padding: 0.45rem 0.7rem;
      cursor: pointer;
    }
    #list button small { display: block; color: var(--muted); }
    #list button.selected { background: #e6f0df; }
    #list button.missing small::after { content: " · no image"; }
    #stage {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: 1rem;
    }
    #stage img { max-width: 100%; max-height: 100%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
    #stage p { color: var(--muted); max-width: 24rem; text-align: center; }
    form {
      overflow: auto;
      border-left: 1px solid var(--line);
      background: #fff;
      padding: 1rem;
    }
    form h2 { margin: 0 0 0.2rem; font-size: 0.95rem; }
    form .id { margin: 0 0 0.8rem; color: var(--muted); font-size: 0.8rem; }
    label.field { display: block; margin: 0 0 0.7rem; font-size: 0.78rem; font-weight: 600; }
    input, select, textarea {
      display: block;
      width: 100%;
      margin-top: 0.25rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.4rem 0.5rem;
      font: inherit;
      font-weight: 400;
    }
    .readonly { color: var(--muted); font-weight: 400; margin: 0 0 0.7rem; }
    .combo { position: relative; }
    #type-menu {
      position: absolute;
      z-index: 2;
      left: 0;
      right: 0;
      max-height: 16rem;
      overflow: auto;
      margin-top: 0.2rem;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    #type-menu button {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      background: #fff;
      padding: 0.4rem 0.5rem;
      cursor: pointer;
      font-weight: 600;
    }
    #type-menu button small { display: block; color: var(--muted); font-weight: 400; }
    #type-menu button:hover, #type-menu button.active { background: #e6f0df; }
    #type-menu p { margin: 0; padding: 0.45rem 0.5rem; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
    button.nav {
      border: 1px solid var(--brand-800);
      background: #fff;
      color: var(--brand-800);
      border-radius: 6px;
      padding: 0.4rem 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.nav.primary { background: var(--brand-800); color: #fff; }
    button.nav:disabled { opacity: 0.45; cursor: default; }
    #status { color: var(--muted); font-size: 0.8rem; }
  </style>
</head>
<body>
  <header>
    <h1>Page labels</h1>
    <input id="query" type="search" placeholder="Chart or page id" />
    <label><input id="with-image" type="checkbox" /> Has image</label>
    <span id="count"></span>
  </header>
  <main>
    <nav id="list"></nav>
    <section id="stage"><p>Loading…</p></section>
    <form id="editor">
      <h2>Tag</h2>
      <p class="id" id="page-id"></p>
      <label class="field">Family
        <input id="page_family" name="page_family" list="families" />
      </label>
      <label class="field">Page type
        <div class="combo">
          <input id="page_type" name="page_type" type="search" placeholder="Search types or families" autocomplete="off" />
          <div id="type-menu" hidden></div>
        </div>
      </label>
      <p class="readonly" id="meta"></p>
      <div class="actions">
        <button class="nav" id="back" type="button" title="Previous page">Back</button>
        <button class="nav primary" id="forward" type="submit" title="Confirm this page. Writes training_final.csv every 10">Next</button>
        <span id="status"></span>
      </div>
      <datalist id="families"></datalist>
    </form>
  </main>
  <script>
    const state = { rows: [], index: 0, families: [], typeIndex: [], saving: false, done: false };

    function visibleAt() {
      const rows = visible();
      const current = state.rows[state.index];
      const at = rows.findIndex((row) => row.page_id === current?.page_id);
      return { rows, at };
    }

    function refreshActions() {
      const { at } = visibleAt();
      document.getElementById("back").disabled = state.saving || at <= 0;
      document.getElementById("forward").disabled = state.saving || state.done;
    }

    function visible() {
      const query = document.getElementById("query").value.trim().toLowerCase();
      const imagesOnly = document.getElementById("with-image").checked;
      return state.rows.filter((row) => {
        if (imagesOnly && !row.has_image) return false;
        if (!query) return true;
        return `${row.chart_id} ${row.page_id} ${row.page_family} ${row.page_type}`.toLowerCase().includes(query);
      });
    }

    function applyCatalog(catalog) {
      state.typeIndex = (catalog || []).map((item) => ({
        type: item.page_type,
        families: [item.page_family].filter(Boolean),
      }));
    }

    function matchingTypes() {
      const query = document.getElementById("page_type").value.trim().toLowerCase();
      const items = state.typeIndex;
      if (!query) return items;
      return items.filter((item) =>
        item.type.toLowerCase().includes(query)
        || item.families.some((family) => family.toLowerCase().includes(query))
      );
    }

    function closeTypeMenu() {
      document.getElementById("type-menu").hidden = true;
    }

    function chooseType(item) {
      document.getElementById("page_type").value = item.type;
      if (item.families.length === 1) {
        document.getElementById("page_family").value = item.families[0];
      }
      closeTypeMenu();
      refreshActions();
    }

    function openTypeMenu() {
      const menu = document.getElementById("type-menu");
      const items = matchingTypes();
      menu.hidden = false;
      if (!items.length) {
        menu.replaceChildren(Object.assign(document.createElement("p"), {
          textContent: "No matching type",
        }));
        return;
      }
      menu.replaceChildren(...items.map((item) => {
        const button = document.createElement("button");
        button.type = "button";
        const name = document.createElement("span");
        name.textContent = item.type;
        const family = document.createElement("small");
        family.textContent = item.families.join(", ") || "No family";
        button.append(name, family);
        button.addEventListener("mousedown", (event) => event.preventDefault());
        button.addEventListener("click", () => chooseType(item));
        return button;
      }));
    }

    function fillList(name, values) {
      const list = document.getElementById(name);
      list.replaceChildren(...values.map((value) => {
        const option = document.createElement("option");
        option.value = value;
        return option;
      }));
    }

    function renderList() {
      const rows = visible();
      const current = state.rows[state.index];
      const list = document.getElementById("list");
      list.replaceChildren(...rows.map((row) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = row.page_id === current?.page_id ? "selected" : "";
        if (!row.has_image) button.classList.add("missing");
        button.innerHTML = `<strong>${row.page_type || "—"}</strong><small>${row.page_id}</small>`;
        button.addEventListener("click", () => select(state.rows.indexOf(row)));
        return button;
      }));
      document.getElementById("count").textContent = `${rows.length} of ${state.rows.length}`;
      const selected = list.querySelector(".selected");
      if (selected) selected.scrollIntoView({ block: "nearest" });
    }

    function select(index) {
      state.done = false;
      state.index = index;
      const row = state.rows[index];
      document.getElementById("page-id").textContent = row
        ? `${row.page_id} · page ${row.page_index}`
        : "";
      document.getElementById("page_family").value = row?.page_family || "";
      document.getElementById("page_type").value = row?.page_type || "";
      document.getElementById("meta").textContent = row
        ? [row.codeability, row.note].filter(Boolean).join(" · ")
        : "";
      refreshActions();
      document.getElementById("status").textContent = "";
      const stage = document.getElementById("stage");
      stage.replaceChildren();
      if (!row) {
        stage.append(Object.assign(document.createElement("p"), { textContent: "No pages." }));
      } else if (!row.has_image) {
        stage.append(Object.assign(document.createElement("p"), {
          textContent: `No scan for ${row.chart_id} page ${row.page_index}.`,
        }));
      } else {
        const image = document.createElement("img");
        image.alt = row.page_id;
        image.src = `/api/image?page_id=${encodeURIComponent(row.page_id)}`;
        stage.append(image);
      }
      renderList();
    }

    async function load() {
      const data = await fetch("/api/labels").then((response) => response.json());
      state.rows = data.rows;
      state.families = data.page_family;
      applyCatalog(data.catalog);
      if (!state.typeIndex.length) {
        applyCatalog(data.page_type.map((type) => ({ page_type: type, page_family: "" })));
      }
      fillList("families", state.families);
      const firstImage = state.rows.findIndex((row) => row.has_image);
      select(firstImage >= 0 ? firstImage : 0);
    }

    async function pushCurrent(flush) {
      const row = state.rows[state.index];
      const status = document.getElementById("status");
      if (!row) return null;
      const body = {
        page_id: row.page_id,
        page_family: document.getElementById("page_family").value.trim(),
        page_type: document.getElementById("page_type").value.trim(),
        flush,
      };
      state.saving = true;
      refreshActions();
      const response = await fetch("/api/labels", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      state.saving = false;
      if (!response.ok) {
        status.textContent = "Save failed";
        refreshActions();
        return null;
      }
      const payload = await response.json();
      row.page_family = payload.page_family || "";
      row.page_type = payload.page_type || "";
      return payload;
    }

    function goBack() {
      if (state.saving) return;
      const { rows, at } = visibleAt();
      if (at > 0) select(state.rows.indexOf(rows[at - 1]));
    }

    function wroteFinal(payload) {
      return `Wrote training_final.csv (${payload.final_count} pages)`;
    }

    async function goNext() {
      if (state.saving || state.done) return;
      const { rows, at } = visibleAt();
      const last = at < 0 || at >= rows.length - 1;
      const payload = await pushCurrent(last);
      if (!payload) return;
      const next = rows[at + 1];
      if (next) {
        select(state.rows.indexOf(next));
        if (payload.flushed) {
          document.getElementById("status").textContent = wroteFinal(payload);
        }
        return;
      }
      state.done = true;
      document.getElementById("status").textContent = payload.flushed
        ? `${wroteFinal(payload)}. End of the list.`
        : "End of the list.";
      refreshActions();
    }

    document.getElementById("editor").addEventListener("submit", (event) => {
      event.preventDefault();
      goNext();
    });
    document.getElementById("page_family").addEventListener("input", refreshActions);
    const typeInput = document.getElementById("page_type");
    typeInput.addEventListener("focus", openTypeMenu);
    typeInput.addEventListener("input", () => {
      openTypeMenu();
      refreshActions();
    });
    typeInput.addEventListener("blur", closeTypeMenu);
    typeInput.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeTypeMenu();
      if (event.key === "Enter" && !document.getElementById("type-menu").hidden) {
        const first = document.getElementById("type-menu").querySelector("button");
        if (first) {
          event.preventDefault();
          first.click();
        }
      }
    });
    document.getElementById("back").addEventListener("click", goBack);
    document.getElementById("query").addEventListener("input", () => {
      renderList();
      refreshActions();
    });
    document.getElementById("with-image").addEventListener("change", () => {
      renderList();
      refreshActions();
    });
    document.addEventListener("keydown", (event) => {
      if (event.target.matches("input, textarea, select")) return;
      if (event.key === "ArrowLeft") goBack();
      if (event.key === "ArrowRight") goNext();
    });
    load();
  </script>
</body>
</html>
