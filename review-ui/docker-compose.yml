# review-ui — deployed on its own.
#
#   docker compose --env-file .env up -d --build
#
# A viewer over what core-pipeline produced, plus ground-truth entry. It shares only
# data with the core-pipeline deployment (2026-11-07):
#   * the database: results, ground truth, users (DATABASE_URL)
#   * Azure Blob: page images (Processed output_path first, then Raw_Input)
# No chart folders are mounted: there is no Local mode. It calls the core-pipeline API
# only for the admins' Playground (CORE_PIPELINE_URLS); core-pipeline never calls this one.

services:
  backend:
    build:
      context: ./backend
    ports:
      # Host ports: a second instance on the same host (docs/CLIENT_INSTANCE.md) sets its own.
      - "${BACKEND_PORT:-4000}:3000"
    env_file:
      - ./.env
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:4001,http://localhost:4001}
      # Every screen reads the database through this.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://USER:PASSWORD@HOST:5432/imaging_outputs}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      DB_POOL_MIN: ${DB_POOL_MIN:-4}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_POOL_WAIT_SEC: ${DB_POOL_WAIT_SEC:-10}
      # Same names as core-pipeline (AZURE_STORAGE_*); the BLOB_* ones still work.
      AZURE_STORAGE_AUTH: ${AZURE_STORAGE_AUTH:-entra}
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME:-}
      AZURE_STORAGE_ACCOUNT_KEY: ${AZURE_STORAGE_ACCOUNT_KEY:-}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-}
      BLOB_AUTH_MODE: ${BLOB_AUTH_MODE:-}
      BLOB_ACCOUNT_URL: ${BLOB_ACCOUNT_URL:-}
      BLOB_CONTAINER: ${BLOB_CONTAINER:-}
      BLOB_PATH_TEMPLATE: ${BLOB_PATH_TEMPLATE:-{folder}/pages/{filename}}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      BLOB_SAS_TOKEN: ${BLOB_SAS_TOKEN:-}
      # Playground (admins): the core-pipeline APIs a run can go to, "Label=URL" pairs,
      # first = default. Inside this container "localhost" is the container itself:
      # the pipeline on the same host is http://host.docker.internal:8001. Set to empty in
      # .env ("CORE_PIPELINE_URLS=") to turn the Playground off (docs/CLIENT_INSTANCE.md).
      CORE_PIPELINE_URLS: ${CORE_PIPELINE_URLS-VM=http://172.20.4.170:8001,Local=http://host.docker.internal:8001}
      PLAYGROUND_CONTAINER: ${PLAYGROUND_CONTAINER:-imaging-pipeline}
    # host.docker.internal on Linux too (the Playground's CORE_PIPELINE_URL).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Optional: MiniLM for the accuracy report's semantic page-type match
      - ${SEMANTIC_MODEL_HOST_PATH:-../core-pipeline/models/semantic-model}:/models/semantic-model:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-4001}:3001"
    environment:
      # The backend to send /api to. Another host when the frontend is deployed alone.
      BACKEND_URL: ${BACKEND_URL:-http://backend:3000}
    depends_on:
      - backend
    restart: unless-stopped
