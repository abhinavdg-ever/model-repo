# review-ui — deployed on its own.
#
#   docker compose --env-file .env up -d --build
#
# A read-only viewer over what core-pipeline produced. It shares exactly two
# things with the core-pipeline deployment:
#   * the Postgres database (available later; compose is Local Mode for now)
#   * the chart workspace volume, mounted READ-ONLY here
# It calls the core-pipeline API only for the admins' Playground (CORE_PIPELINE_URLS);
# core-pipeline never calls this one.
#
# Two modes, switched per browser from the top bar (Local / DB):
#   Local — OCR / imaging / page images from /data/folders.
#   DB    — Postgres for results, Azure Blob for page images (Processed
#           output_path first, then Raw_Input). Needs DATABASE_URL and blob
#           access (BLOB_ACCOUNT_URL + AZURE_* or a managed identity).
# DATA_MODE (local | production) is what a browser that never chose sees.

services:
  backend:
    build:
      context: ./backend
    ports:
      - "4000:3000"
    env_file:
      - ./.env
    environment:
      DATA_MODE: ${DATA_MODE:-local}
      DATA_ROOT: /data/folders
      METADATA_ROOT: ${METADATA_ROOT:-/data/metadata}
      PIPELINE_ROOT: /data/pipeline
      MONOREPO_ROOT: /data/pipeline
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:4001,http://localhost:4001}
      # DB mode, Manual Review and Accuracy read Postgres through this.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://USER:PASSWORD@HOST:5432/imaging_outputs}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      DB_POOL_MIN: ${DB_POOL_MIN:-1}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_POOL_WAIT_SEC: ${DB_POOL_WAIT_SEC:-10}
      # Seconds a scan of /data/folders is trusted before it is rechecked
      # against file mtimes. core-pipeline writes this volume while the UI is
      # serving, so a long TTL shows stale stage badges.
      LOCAL_CACHE_TTL_SECONDS: ${LOCAL_CACHE_TTL_SECONDS:-5}
      # Optional File Viewer (Azure Blob). Off unless FILE_VIEWER_BLOB_ENABLED=true.
      FILE_VIEWER_BLOB_ENABLED: ${FILE_VIEWER_BLOB_ENABLED:-false}
      # Same names as core-pipeline (AZURE_STORAGE_*); the BLOB_* ones still work.
      AZURE_STORAGE_AUTH: ${AZURE_STORAGE_AUTH:-entra}
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME:-}
      AZURE_STORAGE_ACCOUNT_KEY: ${AZURE_STORAGE_ACCOUNT_KEY:-}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-}
      BLOB_AUTH_MODE: ${BLOB_AUTH_MODE:-}
      BLOB_ACCOUNT_URL: ${BLOB_ACCOUNT_URL:-}
      BLOB_CONTAINER: ${BLOB_CONTAINER:-}
      BLOB_PATH_TEMPLATE: ${BLOB_PATH_TEMPLATE:-{folder}/pages/{filename}}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      BLOB_SAS_TOKEN: ${BLOB_SAS_TOKEN:-}
      # Playground (admins): the core-pipeline APIs a run can go to, comma-separated,
      # first = default. Inside this container "localhost" is the container itself:
      # the pipeline on the same host is http://host.docker.internal:8001.
      CORE_PIPELINE_URLS: ${CORE_PIPELINE_URLS:-http://host.docker.internal:8001,http://172.20.4.170:8001}
      PLAYGROUND_CONTAINER: ${PLAYGROUND_CONTAINER:-imaging-pipeline}
    # host.docker.internal on Linux too (the Playground's CORE_PIPELINE_URL).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${DATA_HOST_PATH:-./data/folders}:/data/folders:ro
      - ${PIPELINE_HOST_PATH:-./data/pipeline}:/data/pipeline:ro
      - ${METADATA_HOST_PATH:-./data/metadata}:/data/metadata:ro
      # Optional: MiniLM for the accuracy report's semantic page-type match
      - ${SEMANTIC_MODEL_HOST_PATH:-../core-pipeline/models/semantic-model}:/models/semantic-model:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "4001:3001"
    depends_on:
      - backend
    restart: unless-stopped
